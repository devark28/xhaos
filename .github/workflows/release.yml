name: Release

# Pushing a version tag (v0.2.0) builds the release archives (linux/amd64 and
# linux/arm64, the page built in) and publishes them with SHA256SUMS, which
# install.sh downloads and checks.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the archives
        run: VERSION="$GITHUB_REF_NAME" TARGETS="linux/amd64 linux/arm64" scripts/release.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
